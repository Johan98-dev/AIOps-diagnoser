version: '3.8'

services:
  # ==========================================
  # Core AIOps Diagnoser API Service
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiops-diagnoser-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - LANGFUSE_HOST=http://langfuse-web:3000
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - signoz-otel-collector
      - langfuse-web

  # ==========================================
  # LLMOps Observability: Langfuse Stack
  # ==========================================
  langfuse-db:
    image: postgres:15-alpine
    container_name: aiops-langfuse-db
    restart: always
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    ports:
      - "5433:5432"
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse-web:
    image: langfuse/langfuse:2
    container_name: aiops-langfuse-web
    restart: always
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=aiops-diagnoser-nextauth-secret-key-12345
      - SALT=aiops-diagnoser-salt-key-12345
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=true

  # ==========================================
  # System Observability: OpenTelemetry & SigNoz Stack
  # ==========================================
  signoz-otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: aiops-otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro

volumes:
  langfuse_db_data:
